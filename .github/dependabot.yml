# Abre pull requests sozinho quando uma dependência (ou a ação do CI) tem versão nova ou correção de segurança.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
